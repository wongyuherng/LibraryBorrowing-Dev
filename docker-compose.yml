
services:

  user-service:
    build: ./services/user-service
    container_name: libraryborrowing-user-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_USER: library_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: libraryborrowing_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - libraryborrowing-network
    restart: unless-stopped

  book-service:
    build: ./services/book-service
    container_name: libraryborrowing-book-service
    ports:
      - "3002:3002"
    environment:
      DB_HOST: db
      DB_USER: library_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: libraryborrowing_db
      PORT: 3002
    depends_on:
      db:
        condition: service_healthy
    networks:
      - libraryborrowing-network
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    container_name: libraryborrowing-order-service
    ports:
      - "3003:3003"
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      PORT: 3003
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - libraryborrowing-network
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    container_name: libraryborrowing-api-gateway
    ports:
      - "8000:8000"
    environment:
      USER_SERVICE_URL: http://user-service:3001
      BOOK_SERVICE_URL: http://book-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PORT: 8000
    depends_on:
      - user-service
      - book-service
      - order-service
    networks:
      - libraryborrowing-network
    restart: unless-stopped

  # Old monolithic backend (disabled for Lab 5.1)
  # backend:
  #   build: ./backend
  #   container_name: libraryborrowing-backend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DB_HOST: db
  #     DB_USER: library_user
  #     DB_PASSWORD: ${MYSQL_PASSWORD}
  #     DB_NAME: libraryborrowing_db
  #     PORT: 3000
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - libraryborrowing-network
  #   restart: on-failure


  prometheus:
    image: prom/prometheus:latest
    container_name: libraryborrowing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - user-service
      - book-service
      - order-service
    networks:
      - libraryborrowing-network
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: libraryborrowing-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: libraryborrowing_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - libraryborrowing-network

  redis:
    image: redis:8-alpine
    container_name: libraryborrowing-redis
    ports:
      - "6379:6379"
    networks:
      - libraryborrowing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    container_name: libraryborrowing-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - libraryborrowing-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 90s

volumes:
  mysql-data:
  mongo-data:

networks:
  libraryborrowing-network:
    driver: bridge
