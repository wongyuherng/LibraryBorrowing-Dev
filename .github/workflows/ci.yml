
name: Library Borrowing CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - services/user-service
          - services/book-service
          - services/order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run Jest tests
        working-directory: ${{ matrix.service }}
        run: npm test

  deploy:
    name: Deploy to VM
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Update code and redeploy
        run: |
          set -e
          cd ~/libraryborrowing-app
          git pull --ff-only origin main
          docker compose up -d --build --no-deps user-service book-service order-service api-gateway
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health
          curl -fsS http://localhost:8000/api/books > /dev/null
          docker compose ps
