global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-service:3001']

  - job_name: 'book-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['book-service:3002']

  - job_name: 'order-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['order-service:3003']
